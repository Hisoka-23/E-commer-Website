<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<section>
		<div class="container-fluid p-5 mt-5">
			<div class="row">
			
				<div class="col-md-3">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">
						<p class="fs-4">Add Category</p>
						
						<th:block th:if="${session.succMsg}">
							<p class="text-success fw-bold">[[${session.succMsg}]]</p>
							<th:block th:text="${@commonServiceImpl.removeServiceMessage()}"></th:block>
							
						</th:block>
						
						<th:block th:if="${session.errorMsg}">
							<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
							<th:block th:text="${@commonServiceImpl.removeServiceMessage()}"></th:block>

						</th:block>
						
						</div>
							<div class="card-body">
								<form th:action="@{/admin/saveCategory}" th:object="${category}" method="post" enctype="multipart/form-data">
									<div class="mb-3">
										<label>Enter Category</label>
										<input type="text" name="name"  class="form-control">
									</div>
									
									<div class="mb-3">
										<label>Status</label>
										<div class="form-check">
										  <input class="form-check-input" type="radio" name="isActive" id="radioDefault1" checked value=true>
										  <label class="form-check-label" for="radioDefault1">
										    Active
										  </label>
										</div>
										<div class="form-check">
										  <input class="form-check-input" type="radio" name="isActive" id="radioDefault2" value="false">
										  <label class="form-check-label" for="radioDefault2">
										    Inactive
										  </label>
										</div>
									</div>
						
									<div class="mb-3">
										<label>Upload Image</label>
										<input type="file"  name="file" class="form-control">
									</div>
									
									<button class="btn btn-primary col-md-12 mt-2">
										Save
									</button>
									
								</form>
						</div>
					</div>
				</div>
				
				<div class="col-md-8">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">Category Details</div>
							<div class="card-body">
								<table class="table">
								  <thead>
								    <tr>
								      <th scope="col">Sl No</th>
								      <th scope="col">Category</th>
										<th scope="col">Status</th>
								      <th scope="col">Image</th>
								      <th scope="col">Action</th>
								    </tr>
								  </thead>
								  <tbody>
								    <tr th:each="cat,c:${categorys}">
								      <th scope="row">[[${c.count}]]</th>
								      <td>[[${cat.name}]]</td>
								      <td>[[${cat.isActive}]]</td>
								      <td><img th:src="@{'/img/category_img/' + ${cat.imageName}}" width="100px" height="100px"></td>
								  		<td>
											<a th:href="@{'/admin/loadEditCategory/' +${cat.id}}" class="btn btn-primary btn-sm"><i class="fa-regular fa-pen-to-square fa-1x">Edit</i></a>
											<a th:href="@{'/admin/deleteCategory/' + ${cat.id}}" class="btn btn-danger btn-sm"><i class="fa-regular fa-trash fa-1x"></i>Delete</a>
										</td>
								  </tbody>
								</table>
							</div>
					</div>
				</div>
				
			</div>
		</div>
	</section>

</body>
</html>
