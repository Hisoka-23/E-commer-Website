<!DOCTYPE>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<section>
		
		<div class="container-fluid bg-primary p-5 mt-5">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<form action="search" method="get">
						<div class="input-group">
							<input type="text" class="form-control" name="ch">
								<button class="btn btn-light text-dark ms-3 col-md-2"><i class="fa-solid fa-magnifying-glass"></i>Search </button>
						</div>
					</form>
				</div>
			</div>
		</div>
		
		
		<div class="container-fluid mt-1">
			<div class="row">
			
			
				<div class="col-md-2 p-0">
				<div class="card shadow-sm p-3 mb-5 bg-body-tertiary rounded">
			<div class="card-body">
					<div class="list-group">
						<p class="fs-5">Category</p>
						  <a href="/products"
							 th:classappend="${paramValue == null or paramValue == ''} ? 'active' : ''"
							 class="list-group-item list-group-item-action" aria-current="true">
						    All
						  </a>

						<a th:each="c:${categories}"
						    th:href="@{'/products?category='+${c.name}}"
						   th:classappend="${paramValue == c.name} ? 'active' : ''"
						    class="list-group-item list-group-item-action">[[${c.name}]]</a>

					</div>
				</div>
				
				</div>
			</div>
				
					<div class="col-md-10">
					
						<div class="card shadow-sm p-3 mb-5 bg-body-tertiary rounded">
							<div class="card-body">
								<div class="fs-3 text-center">Products</div>
								
									<div class="row mt-3">

										<th:block th:if="${products.size > 0}">



										<div class="col-md-3 mb-3" th:each="p:${products}">
										 	<div class="card">
										 	 	<div class="card-body">
										 	 		<img alt="" th:src="@{'/img/product_img/'+${p.image}}" width="100%" height="180px">
										 	 		<p class="fs-5 text-center">[[${p.title}]]</p>
										 	 		<div class="row text-center">
										 	 			<p class="fs-6 fw-bold">
															<samp class="">&#8377;[[${p.discountPrice}]]</samp>
															<br>
															<samp class="text-decoration-line-through text-secondary">&#8377;[[${p.price}]]</samp>
										 	 				<samp class="fs-6 text-success">[[${p.discount}]]% off</samp>
										 	 			</p>
										 	 			<a th:href="@{'/product/'+${p.id}}" class="btn btn-primary col-md-6 offset-md-3">View Details</a>
										 	 		</div>
										 	 	</div>
										 	</div>
										</div>
										</th:block>

										<th:block th:unless="${products.size > 0}">
											<p class="fs-f4 text-center mt-4 text-danger">Product not available</p>
										</th:block>

									</div>
								
							</div>
						</div>

<!--  Start pagination  -->
						<div class="row">
							<div class="col-md-4">Total Products : 123</div>
							<div class="col-md-6">
								<nav aria-label="Page navigation example">
									<ul class="pagination">
										<li class="page-item">
											<a class="page-link" href="#" aria-label="Previous">
												<span aria-hidden="true">&laquo;</span>
											</a>
										</li>
										<li class="page-item"><a class="page-link" href="#">1</a></li>
										<li class="page-item"><a class="page-link" href="#">2</a></li>
										<li class="page-item"><a class="page-link" href="#">3</a></li>
										<li class="page-item">
											<a class="page-link" href="#" aria-label="Next">
												<span aria-hidden="true">&raquo;</span>
											</a>
										</li>
									</ul>
								</nav>
							</div>
						</div>
						<!--  End pagination  -->
					</div>
				
			</div>
		</div>
		
		
	</section>

</body>
</html>
